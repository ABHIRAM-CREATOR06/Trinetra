version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trinetra-backend
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    environment:
      - DATABASE_URL=sqlite://data/trinetra.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trinetra-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
